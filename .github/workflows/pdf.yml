name: Generate PDF/HTML
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pdf
            dir: .
            task: devcon-pdf
            artifact: pdf
            file: kubexporter_kubernetes_backup_better_together.pdf
            html_task: devcon-html
            html_artifact: html
            html_file: kubexporter_kubernetes_backup_better_together.html
          - name: pdf-kubexporter
            dir: kubexporter
            task: kubexporter-pdf
            artifact: pdf-kubexporter
            file: kubexporter.pdf
            html_task: kubexporter-html
            html_artifact: html-kubexporter
            html_file: kubexporter.html
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Generate PDF ${{ matrix.name }}
        run: |
          cd ${{ matrix.dir }}
          expect "${GITHUB_WORKSPACE}/.github/scripts/expect-tty.exp" --rows 30 --cols 120 -- \
            devbox run ${{ matrix.task }}

      - name: Upload PDF ${{ matrix.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/${{ matrix.file }}

      - name: Generate HTML ${{ matrix.name }}
        run: |
          cd ${{ matrix.dir }}
          expect "${GITHUB_WORKSPACE}/.github/scripts/expect-tty.exp" --rows 30 --cols 120 -- \
            devbox run ${{ matrix.html_task }}

      - name: Upload HTML ${{ matrix.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.html_artifact }}
          path: ${{ matrix.dir }}/${{ matrix.html_file }}
